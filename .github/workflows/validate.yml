name: validate

on:
  push:
  pull_request:
  schedule:
    # Weekly drift check against ReadyTrader-Crypto main (tool list, env vars, links, live paper path).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Offline checks (frontmatter, references, config parity, tool/phantom names, hygiene, DOX)
        run: python3 scripts/validate.py --offline
      - name: Online checks (ReadyTrader-Crypto tool/env drift, upstream links; fail-closed on fetch errors)
        run: python3 scripts/validate.py

  live-smoke:
    # Launches ReadyTrader-Crypto main over MCP stdio with references/mcp-config.yaml's env and
    # runs deposit -> validate_trade_risk -> place_cex_order(price=...). Red means the documented
    # paper path is broken upstream (e.g. before ReadyTrader-Crypto PR #5), not that this repo is.
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: up2itnow0822/ReadyTrader-Crypto
          ref: main
          path: ReadyTrader-Crypto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ReadyTrader-Crypto into its own venv
        run: |
          python3 -m venv ReadyTrader-Crypto/.venv
          ReadyTrader-Crypto/.venv/bin/pip install --upgrade pip
          ReadyTrader-Crypto/.venv/bin/pip install -r ReadyTrader-Crypto/requirements.txt
          pip install pyyaml
      - name: Live paper-path smoke over MCP stdio
        run: >
          python3 scripts/validate.py --offline --live
          --rt-root ReadyTrader-Crypto
          --rt-python ReadyTrader-Crypto/.venv/bin/python
          --tmp "$RUNNER_TEMP/rt-live"
